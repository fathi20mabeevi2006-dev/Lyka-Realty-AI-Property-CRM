{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card error-card">
    <h2 class="error-code">{{ code }}</h2>
    <p>{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to dashboard</a>
</div>
{% endblock %}
