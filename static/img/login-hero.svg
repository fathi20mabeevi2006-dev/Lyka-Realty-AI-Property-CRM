<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Modern luxury villa with an infinity pool at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060d"/>
      <stop offset="0.30" stop-color="#071127"/>
      <stop offset="0.55" stop-color="#0f2544"/>
      <stop offset="0.70" stop-color="#1d3f60"/>
      <stop offset="0.79" stop-color="#7a5f39"/>
      <stop offset="0.85" stop-color="#2a3a58"/>
      <stop offset="1" stop-color="#060c17"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.62" cy="0.70" r="0.55">
      <stop offset="0" stop-color="#f2cd86" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c8a24a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c8a24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e2440"/>
      <stop offset="0.5" stop-color="#14314f"/>
      <stop offset="1" stop-color="#0b1d34"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f36"/>
      <stop offset="1" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2138"/>
      <stop offset="0.45" stop-color="#08152a"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky + dusk glow -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="720" fill="url(#dusk)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="180" cy="90" r="1.4" opacity="0.6"/>
    <circle cx="330" cy="160" r="1.1" opacity="0.45"/>
    <circle cx="480" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="640" cy="140" r="1" opacity="0.4"/>
    <circle cx="820" cy="60" r="1.4" opacity="0.6"/>
    <circle cx="980" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="1140" cy="80" r="1.5" opacity="0.65"/>
    <circle cx="1300" cy="150" r="1" opacity="0.4"/>
    <circle cx="1450" cy="95" r="1.3" opacity="0.55"/>
    <circle cx="120" cy="230" r="1" opacity="0.35"/>
    <circle cx="760" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="1380" cy="250" r="1" opacity="0.35"/>
  </g>

  <!-- distant hills -->
  <path d="M0 585 L180 500 L360 560 L560 470 L820 555 L1080 480 L1360 560 L1600 505 L1600 620 L0 620 Z"
        fill="#0a1728" opacity="0.95"/>
  <path d="M0 600 L260 545 L520 605 L820 540 L1120 605 L1420 555 L1600 600 L1600 640 L0 640 Z"
        fill="#081120" opacity="0.95"/>

  <!-- warm ambient glow behind villa -->
  <ellipse cx="470" cy="470" rx="360" ry="180" fill="#f0b95e" opacity="0.16" filter="url(#glow)"/>

  <!-- ===== Modern villa ===== -->
  <g>
    <!-- ground floor volume -->
    <rect x="230" y="470" width="300" height="134" fill="url(#wall)"/>
    <!-- upper volume -->
    <rect x="292" y="378" width="240" height="92" fill="url(#wall)"/>
    <!-- glass tower -->
    <rect x="520" y="376" width="180" height="228" fill="url(#glass)"/>

    <!-- roof lines -->
    <rect x="286" y="370" width="420" height="9" fill="#17314f"/>
    <rect x="224" y="464" width="306" height="7" fill="#12283f"/>

    <!-- interior warm glow (blurred) -->
    <g filter="url(#soft)" opacity="0.75">
      <rect x="252" y="500" width="248" height="80" fill="#f0b95e"/>
      <rect x="316" y="402" width="192" height="46" fill="#f3cd82"/>
      <rect x="530" y="410" width="160" height="180" fill="#eeae52"/>
    </g>

    <!-- upper windows -->
    <g fill="#f7d894">
      <rect x="316" y="404" width="40" height="42" opacity="0.95"/>
      <rect x="368" y="404" width="40" height="42" opacity="0.8"/>
      <rect x="420" y="404" width="40" height="42" opacity="0.9"/>
      <rect x="472" y="404" width="40" height="42" opacity="0.75"/>
    </g>

    <!-- ground floor windows -->
    <g fill="#f7d894">
      <rect x="252" y="502" width="40" height="74" opacity="0.9"/>
      <rect x="308" y="502" width="40" height="74" opacity="0.75"/>
      <rect x="364" y="502" width="40" height="74" opacity="0.95"/>
      <rect x="420" y="502" width="40" height="74" opacity="0.8"/>
      <rect x="476" y="502" width="40" height="74" opacity="0.7"/>
    </g>

    <!-- glass tower mullions + warm panes -->
    <g>
      <rect x="536" y="392" width="42" height="196" fill="#f3cd82" opacity="0.55"/>
      <rect x="590" y="392" width="42" height="196" fill="#f3cd82" opacity="0.5"/>
      <rect x="644" y="392" width="42" height="196" fill="#f3cd82" opacity="0.58"/>
      <g stroke="#17314f" stroke-width="4">
        <line x1="550" y1="376" x2="550" y2="604"/>
        <line x1="604" y1="376" x2="604" y2="604"/>
        <line x1="658" y1="376" x2="658" y2="604"/>
      </g>
      <rect x="520" y="376" width="180" height="228" fill="none" stroke="#1c3a5c" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== Infinity pool ===== -->
  <g>
    <!-- infinity edge -->
    <rect x="0" y="598" width="1600" height="16" fill="#0c1c30"/>
    <rect x="0" y="598" width="1600" height="3" fill="#e8c374" opacity="0.35"/>
    <!-- water -->
    <rect y="614" width="1600" height="386" fill="url(#water)"/>
    <!-- warm light reflections -->
    <g filter="url(#soft)" opacity="0.32" fill="#f0b95e">
      <rect x="266" y="618" width="30" height="180"/>
      <rect x="322" y="618" width="30" height="200"/>
      <rect x="378" y="618" width="30" height="170"/>
      <rect x="434" y="618" width="30" height="210"/>
      <rect x="490" y="618" width="30" height="190"/>
      <rect x="544" y="618" width="46" height="230"/>
      <rect x="600" y="618" width="46" height="250"/>
      <rect x="656" y="618" width="46" height="225"/>
    </g>
    <!-- ripples -->
    <g fill="#c8a24a" opacity="0.16">
      <rect x="120" y="720" width="180" height="3"/>
      <rect x="400" y="760" width="220" height="3"/>
      <rect x="700" y="700" width="160" height="3"/>
      <rect x="980" y="780" width="240" height="3"/>
      <rect x="520" y="860" width="300" height="3"/>
      <rect x="200" y="900" width="200" height="3"/>
      <rect x="1120" y="880" width="260" height="3"/>
    </g>
  </g>

  <!-- ===== Palm silhouettes ===== -->
  <g fill="#050b15">
    <path d="M120 900 C110 780 108 700 96 640 C128 690 140 760 138 900 Z"/>
    <g>
      <path d="M96 640 C60 620 30 626 6 648 C40 636 70 644 96 640 Z"/>
      <path d="M96 640 C66 606 34 598 4 606 C44 606 74 622 96 640 Z"/>
      <path d="M96 640 C102 600 90 566 64 544 C86 578 92 610 96 640 Z"/>
      <path d="M96 640 C134 610 168 604 202 612 C160 610 126 624 96 640 Z"/>
      <path d="M96 640 C138 626 176 632 210 652 C172 638 134 636 96 640 Z"/>
      <path d="M96 640 C118 596 150 574 186 566 C146 578 118 606 96 640 Z"/>
    </g>
    <path d="M1490 910 C1500 790 1502 706 1514 646 C1484 700 1472 772 1474 910 Z"/>
    <g>
      <path d="M1514 646 C1550 626 1582 632 1600 654 C1568 642 1540 650 1514 646 Z"/>
      <path d="M1514 646 C1546 612 1578 604 1600 612 C1564 612 1536 628 1514 646 Z"/>
      <path d="M1514 646 C1508 606 1520 572 1546 550 C1524 584 1518 616 1514 646 Z"/>
      <path d="M1514 646 C1476 616 1442 610 1408 618 C1450 616 1484 630 1514 646 Z"/>
      <path d="M1514 646 C1472 632 1434 638 1400 658 C1438 644 1476 642 1514 646 Z"/>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1600" height="1000" fill="url(#dusk)" opacity="0"/>
</svg>
