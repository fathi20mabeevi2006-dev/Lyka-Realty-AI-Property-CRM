<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Residential tower sample illustration">
  <defs>
    <linearGradient id="twr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2742"/>
      <stop offset="0.55" stop-color="#4d618c"/>
      <stop offset="1" stop-color="#93aecf"/>
    </linearGradient>
    <linearGradient id="twr-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb4de"/>
      <stop offset="0.5" stop-color="#c3d6ee"/>
      <stop offset="1" stop-color="#7fa7d4"/>
    </linearGradient>
    <pattern id="twr-bands" width="46" height="120" patternUnits="userSpaceOnUse">
      <rect x="8" y="12" width="30" height="96" rx="3" fill="url(#twr-glass)"/>
      <rect x="14" y="20" width="18" height="40" rx="2" fill="#e8f2fb" opacity="0.55"/>
      <rect x="14" y="66" width="18" height="34" rx="2" fill="#dcecfb" opacity="0.45"/>
    </pattern>
    <linearGradient id="twr-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40598a"/>
      <stop offset="1" stop-color="#5d78ac"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#twr-sky)"/>
  <circle cx="330" cy="180" r="70" fill="#ffe08a" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="1100" cy="130" r="4"/>
    <circle cx="1230" cy="210" r="3"/>
    <circle cx="1380" cy="120" r="4"/>
    <circle cx="1180" cy="260" r="2.5"/>
    <circle cx="1460" cy="300" r="3"/>
  </g>
  <!-- background blocks -->
  <g fill="#2c3f63" opacity="0.6">
    <rect x="180" y="470" width="190" height="430"/>
    <rect x="420" y="400" width="150" height="500"/>
    <rect x="990" y="430" width="200" height="470"/>
    <rect x="1230" y="510" width="170" height="390"/>
  </g>
  <g fill="#31486f" opacity="0.85">
    <rect x="200" y="520" width="90" height="380"/>
    <rect x="300" y="440" width="90" height="460"/>
    <rect x="1225" y="540" width="90" height="360"/>
    <rect x="1325" y="470" width="90" height="430"/>
  </g>
  <!-- podium -->
  <rect x="590" y="700" width="420" height="200" rx="8" fill="url(#twr-side)"/>
  <rect x="620" y="730" width="360" height="90" rx="5" fill="#1e2f4d"/>
  <rect x="640" y="742" width="52" height="34" rx="3" fill="#ffd98a" opacity="0.92"/>
  <rect x="704" y="742" width="52" height="34" rx="3" fill="#ffd98a" opacity="0.92"/>
  <rect x="768" y="742" width="52" height="34" rx="3" fill="#ffd98a" opacity="0.92"/>
  <rect x="832" y="742" width="52" height="34" rx="3" fill="#ffd98a" opacity="0.92"/>
  <rect x="720" y="806" width="160" height="70" rx="6" fill="#15233c"/>
  <!-- tower -->
  <rect x="700" y="80" width="200" height="622" rx="6" fill="url(#twr-bands)"/>
  <rect x="700" y="80" width="200" height="622" rx="6" fill="none" stroke="#35548f" stroke-width="2"/>
  <rect x="760" y="20" width="80" height="52" rx="4" fill="url(#twr-side)"/>
  <rect x="778" y="4" width="44" height="18" rx="3" fill="#93aecf"/>
  <rect x="804" y="0" width="6" height="22" fill="#c3d6ee"/>
  <!-- side wing -->
  <rect x="560" y="420" width="140" height="280" rx="6" fill="url(#twr-side)"/>
  <rect x="680" y="420" width="20" height="280" fill="#35548f"/>
  <rect y="860" width="1600" height="40" fill="#22304c"/>
  <rect y="844" width="1600" height="16" fill="#51617a"/>
</svg>