<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Beachfront residence sample illustration">
  <defs>
    <linearGradient id="bnc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7fb8"/>
      <stop offset="0.55" stop-color="#f2c189"/>
      <stop offset="1" stop-color="#ffe6b0"/>
    </linearGradient>
    <linearGradient id="bnc-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa8d0"/>
      <stop offset="1" stop-color="#2177a8"/>
    </linearGradient>
    <linearGradient id="bnc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset="1" stop-color="#e6d3b3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bnc-sky)"/>
  <circle cx="1280" cy="180" r="80" fill="#ffedb3" opacity="0.95"/>
  <!-- sea + waves -->
  <rect x="0" y="610" width="1600" height="230" fill="url(#bnc-sea)"/>
  <g stroke="#bfe8f6" stroke-width="5" fill="none" opacity="0.75">
    <path d="M120 650 q30 -12 60 0 q30 12 60 0"/>
    <path d="M520 690 q30 -12 60 0 q30 12 60 0"/>
    <path d="M980 700 q30 -12 60 0 q30 12 60 0"/>
    <path d="M300 740 q30 -12 60 0 q30 12 60 0"/>
    <path d="M1250 735 q30 -12 60 0 q30 12 60 0"/>
  </g>
  <rect x="0" y="810" width="1600" height="90" fill="#ecd3a0"/>
  <ellipse cx="330" cy="812" rx="90" ry="14" fill="#fff6dd" opacity="0.8"/>
  <ellipse cx="1250" cy="812" rx="90" ry="14" fill="#fff6dd" opacity="0.8"/>
  <!-- beachfront units row -->
  <g>
    <rect x="180" y="520" width="330" height="120" rx="8" fill="url(#bnc-wall)"/>
    <path d="M172 520 L345 472 L518 520 Z" fill="#b6533f"/>
    <rect x="300" y="402" width="90" height="70" rx="4" fill="#9c4636"/>
    <rect x="215" y="560" width="120" height="80" rx="5" fill="#16304a"/>
    <rect x="232" y="576" width="86" height="48" rx="3" fill="#dff1fb" opacity="0.95"/>
    <rect x="368" y="560" width="108" height="80" rx="5" fill="#16304a"/>
    <rect x="386" y="576" width="72" height="48" rx="3" fill="#dff1fb" opacity="0.95"/>
    <rect x="372" y="640" width="12" height="120" fill="#cfae78"/>
    <!-- deck -->
    <rect x="560" y="600" width="300" height="56" rx="6" fill="#b98c4e"/>
    <path d="M872 604 q16 -10 32 0 z" fill="#a87c3f"/>
    <rect x="560" y="656" width="300" height="14" fill="#8a6a36"/>
    <!-- second unit -->
    <rect x="900" y="470" width="330" height="110" rx="8" fill="url(#bnc-wall)"/>
    <path d="M892 470 L1065 424 L1238 470 Z" fill="#9c4636"/>
    <rect x="1040" y="360" width="90" height="64" rx="4" fill="#863a2d"/>
    <rect x="935" y="500" width="120" height="80" rx="5" fill="#16304a"/>
    <rect x="952" y="516" width="86" height="48" rx="3" fill="#dff1fb" opacity="0.95"/>
    <rect x="1085" y="500" width="110" height="80" rx="5" fill="#16304a"/>
    <rect x="1103" y="516" width="74" height="48" rx="3" fill="#dff1fb" opacity="0.95"/>
    <rect x="1000" y="580" width="16" height="30" fill="#cfae78"/>
  </g>
  <!-- palms -->
  <g stroke="#6a4a2a" stroke-width="14" stroke-linecap="round">
    <path d="M80 900 c-6 -120 20 -220 60 -300"/>
  </g>
  <g fill="#2f6b3f">
