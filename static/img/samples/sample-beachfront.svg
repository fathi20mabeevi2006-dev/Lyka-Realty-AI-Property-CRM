  <g fill="#2f6b3f">
    <path d="M1450 540 q60 -26 56 -92 q-64 12 -56 92 Z"/>
    <path d="M1434 532 q16 -72 -34 -98 q-26 62 34 98 Z"/>
    <path d="M1412 530 q-34 -62 -96 -54 q8 64 96 54 Z"/>
  </g>
</svg>